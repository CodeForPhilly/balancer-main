apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: balancer

resources:
  - ../../base
  - configmap.yaml

images:
  - name: ghcr.io/codeforphilly/balancer-main/app
    newTag: latest

configMapGenerator:
  - name: balancer-config
    behavior: merge
    envs:
      - balancer.env

patches:
  - target:
      kind: ListenerSet
      name: balancer-listeners
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: sandbox.balancerproject.org
      - op: replace
        path: /spec/listeners/1/hostname
        value: sandbox.balancerproject.org
  - target:
      kind: HTTPRoute
      name: balancer
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["sandbox.balancerproject.org"]
  
  - target:
      kind: Deployment
      name: balancer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: balancer-db-config
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: balancer-db-credentials
                key: password
