apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: balancer-listeners
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    hostname: HOSTNAME_PLACEHOLDER
spec:
  parentRef:
    name: main-gateway
    namespace: envoy-gateway-system
    group: gateway.networking.k8s.io
    kind: Gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: HOSTNAME_PLACEHOLDER
    - name: https
      protocol: HTTPS
      port: 443
      hostname: HOSTNAME_PLACEHOLDER
      tls:
        mode: Terminate
        certificateRefs:
          - name: balancer-tls
            kind: Secret
