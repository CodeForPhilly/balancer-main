apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: balancer

resources:
  - ../../base

images:
  - name: ghcr.io/codeforphilly/balancer-main/app
    newTag: latest

configMapGenerator:
  - name: balancer-config
    behavior: merge
    envs:
      - balancer.env

patches:
  - target:
      kind: ListenerSet
      name: balancer-listeners
    patch: |-
      - op: replace
        path: /spec/listeners/0/hostname
        value: balancerproject.org
      - op: replace
        path: /spec/listeners/1/hostname
        value: balancerproject.org
  - target:
      kind: HTTPRoute
      name: balancer
    patch: |-
      - op: add
        path: /spec/hostnames
        value: ["balancerproject.org"]
  
