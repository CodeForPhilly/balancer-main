apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balancer
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
  hostnames:
    - HOSTNAME_PLACEHOLDER
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: balancer
          port: 80
