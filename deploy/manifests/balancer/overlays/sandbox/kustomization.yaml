apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: balancer

resources:
  - ../../base
  - configmap.yaml

images:
  - name: ghcr.io/codeforphilly/balancer-main/app
    newTag: 1.1.5

configMapGenerator:
  - name: balancer-config
    behavior: merge
    literals:
      - HOSTNAME=sandbox.balancerproject.org
    envs:
      - balancer.env

labels:
  - includeSelectors: true
    pairs:
      environment: sandbox
      app.kubernetes.io/instance: balancer-sandbox

# No routing patches — the cluster's Gateway carries the hostname and TLS, and
# the HTTPRoute inherits it. See ../../README.md.
patches:
  - target:
      kind: Deployment
      name: balancer
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: balancer-db-config
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: balancer-db-credentials
                key: password