apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: balancer

resources:
  - ../../base

images:
  - name: ghcr.io/codeforphilly/balancer-main/app
    newTag: latest

patches:
  - target:
      kind: HTTPRoute
      name: balancer
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: sandbox.balancerproject.org
