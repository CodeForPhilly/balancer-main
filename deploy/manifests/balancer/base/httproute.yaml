
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: balancer
  annotations:
    hostname: HOSTNAME_PLACEHOLDER
spec:
  parentRefs:
    - name: balancer-listeners
      kind: ListenerSet
      group: gateway.networking.k8s.io
      sectionName: https
  hostnames:
    - HOSTNAME_PLACEHOLDER
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: balancer
          port: 80
